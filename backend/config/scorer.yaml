# =====================================================================
# 主力建仓候选打分模型配置
#
# 六个维度权重合计 100，最终输出 0-100 分。
# 各维度先在候选池内做**百分位归一化**（0-100），再按权重加权求和，
# 这样量纲不同的指标（元 / 百分比 / 无量纲）可以直接相加。
#
# 详细设计见 docs/01-需求与技术选型方案.md §8
# =====================================================================

weights:
  # 1) 主力资金持续流入：近 5 日净流入/流通市值（0.6）+ 近 10 日为正占比（0.4）
  inflow_consistency: 30
  # 2) 放量但不涨：近 5 日均量/20 日均量 ∈ [1.5,4] 且 近 5 日涨幅 ∈ [0,12]
  volume_up_price_flat: 20
  # 3) 大单净额占比：近 5 日 (超大单+大单净流入)/成交额 均值
  large_order_ratio: 15
  # 4) 股价位置低：现价在近 250 日最高-最低区间的分位（越低越好）
  price_position_low: 15
  # 5) 换手适中：当日换手率 ∈ [3%, 12%]
  turnover_moderate: 10
  # 6) 筹码收敛：近 10 日振幅均值 / 前 20 日振幅均值 < 0.8
  chip_convergence: 10

# ---------------------------------------------------------------------
# 粗筛：全市场 ~5200 -> ~3000
# ---------------------------------------------------------------------
coarse_filter:
  exclude_st: true              # 剔除 ST / *ST / 退市整理
  exclude_suspended: true       # 剔除停牌（无成交）
  exclude_limit_pool: true      # 剔除涨停池与跌停池（已是博弈结果，非建仓）
  min_listed_days: 60           # 剔除上市不足 60 个交易日的次新股
  float_mv_min: 1500000000      # 流通市值下限 15 亿（微盘股波动无规律）
  float_mv_max: 200000000000    # 流通市值上限 2000 亿（大盘权重难被主力建仓）
  min_amount: 5000000           # 当日成交额低于 500 万视为无流动性

# ---------------------------------------------------------------------
# 负面过滤：剔除「已经在涨」的，只留还没启动的
# ---------------------------------------------------------------------
negative_filter:
  exclude_zt_pool: true         # 涨停池内的一律排除
  max_boards: 1                 # 连板 >= 2 排除
  max_gain_20d: 40.0            # 近 20 个交易日涨幅 >= 40% 排除（已透支）

# ---------------------------------------------------------------------
# 各维度的原始指标构造
# ---------------------------------------------------------------------
metrics:
  # ---- 维度1 主力资金持续流入 -------------------------------------
  inflow_window_days: 5         # 「近 5 日净流入 / 流通市值」与「>=3日为正」共用的窗口
  inflow_min_days: 3            # 「>=3 日为正」的最低观测天数
  inflow_lookback_days: 10      # 预选阶段的连续性统计窗口（打分阶段不用）
  # ---- 维度2 放量但不涨 -------------------------------------------
  # 打分用「甜区」而非硬阈值：区间内得 1 分，区间外线性衰减到 0。
  # 硬阈值在百分位排序下会让区间边缘的两只股票产生断崖差。
  volume_short_days: 5          # 近 5 日均量
  volume_base_days: 20          # 对比的前 20 日均量
  volume_up_ratio: [1.5, 4.0]   # 近5日均量/20日均量甜区（文档 [1.5, 4]）
  price_gain_range: [0.0, 12.0] # 近 5 日涨幅甜区（文档 [0%, 12%]）
  # ---- 维度3 大单净额占比 -----------------------------------------
  # 均值窗口；只有东财提供大单分解，逐日落库后才凑得出 5 日均值
  # ---- 维度4 股价位置低 -------------------------------------------
  price_position_days: 250      # 文档的近 250 日价格区间
  # ---- 维度5 换手适中 ---------------------------------------------
  turnover_range: [3.0, 12.0]   # 当日换手甜区（文档 [3%, 12%]）
  # ---- 维度6 筹码收敛 ---------------------------------------------
  chip_recent_days: 10          # 近 10 日振幅均值
  chip_base_days: 20            # 前 20 日振幅均值
  chip_threshold: 0.8           # 比值 < 0.8 即达标（用于理由文案）

# ---------------------------------------------------------------------
# 取数与输出
# ---------------------------------------------------------------------
fetch:
  history_days: 400             # 拉日线的日历天数
                                # 维度4 要近 250 个交易日，一年约 250 个交易日/365 自然日
                                # 取 400 留出节假日与停牌的余量
  preselect_top: 300            # 粗筛后按「廉价指标」预选出多少只去拉日线
                                # 拉日线是逐只请求，300 只约 5-13 分钟

output:
  top_n: 30

# 降级说明：东财 push2 不可用时，以下维度会退化，结果里会标注 degraded 维度
#   large_order_ratio  -> 无大单分解，覆盖率 < 10% 时整维弃用，其余权重重归一化
#   inflow_consistency -> 退化为同花顺净额（无大单分解），且逐日序列需自我积累
#                         冷启动只有当日一天，连续性子证据缺失时按剩余子权重归一化
degradation_note: "东财资金流接口不可用时，large_order_ratio 整维弃用；inflow_consistency 连续性子证据需逐日积累"
