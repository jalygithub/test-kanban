# A股看板 · 服务器编排
#   web  = nginx：静态站点 + /api 反代 + 全站 basic_auth
#   app  = uvicorn：FastAPI 单 worker（内含 SQLite、飞书长连接）
#
# 放在部署包目录（含 dist/ data/ config/ nginx/ kanban-backend-1.0.tar）里执行：
#   bash deploy.sh            # 一键：load 镜像 + up -d + 自检
#   docker compose up -d      # 或手工
#   docker compose logs -f app
#
# 日志走 docker logs（不再写 run/backend.log），已配 50m x5 轮转。

services:
  app:
    image: kanban-backend:1.0
    container_name: kanban-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai            # 双保险：镜像 ENV 已设，这里再写一次
      # 盘后任务想换个时间（默认 16:30，读代码默认值）：
      # STOCK_FETCH_HOUR: "17"
      # STOCK_FETCH_MINUTE: "0"
      # 机房 IP 比家里 IP 更容易被东财风控，抓不动时先把限速再放慢：
      # STOCK_REQUEST_SENSITIVE_INTERVAL: "2.5"
      # STOCK_REQUEST_SENSITIVE_JITTER: "3.0"
    volumes:
      - ./data:/app/backend/data        # market.db + trade_calendar.json（含飞书凭据）
      - ./config:/app/backend/config    # scorer.yaml 评分模型，改完 restart app 生效
    expose:
      - "8000"                          # 只给同网络里的 nginx，不对公网开
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys;sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &log
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: nginx:1.27-alpine
    container_name: kanban-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # 上了 HTTPS 就把上面这行改成 "80:80" + "443:443"，并加证书挂载
    volumes:
      - ./dist:/usr/share/nginx/html:ro                 # 前端产物
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro        # 口令文件，生成方式见文档
    logging: *log
