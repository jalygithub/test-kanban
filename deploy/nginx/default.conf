# A股看板 · nginx：全站口令 + 静态站点 + /api 反代
#
# 后端目前**没有任何鉴权**，而 GET /api/feishu/config 会明文吐出飞书 app_secret、
# POST /api/system/stop 能停服务、POST /api/jobs/run 能烧抓取配额。
# 所以 auth_basic 必须放在 server 级（同时罩住 / 与 /api/），这是公网部署的生死线。

server {
    listen 80;
    server_name _;

    auth_basic           "A-share Kanban";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 1m;   # 看板全是小 JSON

    # 公网带宽是「按流量 5Mbps 峰值」≈ 625 KB/s：不压的话首屏那 1.7 MB 的 JS 要 2~3 秒。
    # 开 gzip 后降到 300~500 KB，首屏 < 1s；接口 JSON 一并受益。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root  /usr/share/nginx/html;
    index index.html;

    # 前端是 react-router：非静态文件一律回 index.html，否则刷新子路由 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代到同 compose 网络里的 app:8000
    location /api/ {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # 盘后全量抓取本身可能跑十几分钟，但接口返回不该等那么久；
        # 超过 120s 还没返回说明卡死，交给后端自身的 request_total_timeout 兜底。
        proxy_read_timeout 120s;
    }

    # FastAPI 自带的交互文档会把全部接口暴露给访客，公网直接关掉
    location = /docs      { return 404; }
    location = /redoc     { return 404; }
    location = /openapi.json { return 404; }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
